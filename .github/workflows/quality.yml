name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - run: python tools/check_engineering_skills.py
      - run: python tools/check_doc_params.py
      - run: python tools/check_portability.py
      - run: python -m compileall -q robotics-*/scripts tools tests
      - name: Validate Agent Skills specification
        if: matrix.python-version == '3.12'
        run: |
          for entry in robotics-*/SKILL.md; do
            agentskills validate "$(dirname "$entry")"
          done
      - run: git diff --check
